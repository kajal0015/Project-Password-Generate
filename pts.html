<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator</title>
    <link rel="stylesheet" href="pts.css">
</head>
<body>
    <div class="generator-container">
        <h2>Password Generator</h2>
        
        <div class="result-container">
            <input type="text" id="password-display" readonly placeholder="Your Secure Password">
            <button id="copy-btn" title="Copy to Clipboard">📋</button>
        </div>

        <div class="settings">
            <div class="setting-item">
                <label for="length-slider">Length: <span id="length-val">12</span></label>
                <input type="range" id="length-slider" min="6" max="32" value="12">
            </div>
            
            <div class="setting-item">
                <input type="checkbox" id="include-uppercase" checked>
                <label for="include-uppercase">Include Uppercase Letters</label>
            </div>
            
            <div class="setting-item">
                <input type="checkbox" id="include-lowercase" checked>
                <label for="include-lowercase">Include Lowercase Letters</label>
            </div>
            
            <div class="setting-item">
                <input type="checkbox" id="include-numbers" checked>
                <label for="include-numbers">Include Numbers</label>
            </div>
            
            <div class="setting-item">
                <input type="checkbox" id="include-symbols">
                <label for="include-symbols">Include Symbols</label>
            </div>
        </div>

        <button id="generate-btn">Generate Password</button>
    </div>

    <script src="pts.js"></script>
</body>
</html>
